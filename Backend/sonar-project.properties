# =================================================================
# SonarQube — análisis estático del backend de CareNest
# Va en la carpeta Backend\ (junto a package.json).
# Antes de analizar, generar la cobertura:  npm run test:cobertura
# =================================================================
sonar.projectKey=carenest-backend
sonar.projectName=CareNest - Backend
sonar.projectVersion=0600

# Código fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Cobertura de Jest (formato lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts
